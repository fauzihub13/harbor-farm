# TokenHarbor Auto CLI Configuration
# Copy this file to config.toml and fill in your values.
# WARNING: config.toml contains credentials — it is gitignored. Do NOT commit.

# OPTIONAL email-domain filter.
# Domains are fetched automatically from BlipMail (GET /api/config -> mailDomains).
# Leave empty to use ALL BlipMail domains, or set a comma-separated subset
# to restrict generation to those domains only.
# Example: "mpruy.my.id,jsc.my.id"
ALLOWED_EMAIL = ""

[tokenharbor]
base_url = "https://tokenharbor.ai"
turnstile_sitekey = "0x4AAAAAADBuC8Knz1EJZx9-"
signup_url = "https://tokenharbor.ai/login?mode=signup"
signin_url = "https://tokenharbor.ai/login"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
timezone = "Asia/Jakarta"

[tempmail]
# BlipMail — https://blipmail.mpruy.my.id/docs
base_url = "https://blipmail.mpruy.my.id"
api_base = "https://blipmail.mpruy.my.id/api"
timeout = 120
poll_interval = 3

[capsolver]
# enabled = true  -> solve Turnstile with Capsolver (needs api_key, fast)
# enabled = false -> solve Turnstile with Camoufox (keyless browser solver)
enabled = true
api_key = "CAP-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
timeout = 90
poll_interval = 3

[camoufox]
# Keyless Turnstile solver, used automatically when capsolver.enabled = false.
# Requires: pip install camoufox && camoufox fetch
enabled = true
headless = true
humanize = true
timeout = 120
# Launch browser through the same proxy (slower; off by default).
use_proxy = false
geoip = false
# Max Camoufox browsers solving simultaneously (each is a full browser).
max_concurrency = 3

[proxy]
enabled = true
# DataImpulse direct (rotating gateway)
protocol = "http"
host = "gw.dataimpulse.com"
port = 823
username = "your-dataimpulse-user"
password = "your-dataimpulse-pass"
check_timeout = 8
# Dynamic rotation: give each worker thread its own sticky session (distinct IP).
sticky = true
session_param = "sessid"
# Verify the exit IP differs per thread before using it.
verify_ip = true
ip_check_url = "https://ipinfo.io/json"
max_ip_retries = 5
# Optional extra proxies (full URLs). Leave empty if not used.
# list = ["http://user:pass@host:port"]

[threads]
# Multi-threaded batch creation.
enabled = true
max_workers = 5
start_delay = 0.5

[rate_limit]
# Anti "You're doing that a bit fast" handling.
# No global pacing by default: each thread has its own sticky IP, so parallel
# signups are safe. Set a value > 0 only if you still see burst rate limits.
signup_interval = 0
# Retries on a rate-limit error, with growing backoff + fresh IP/fingerprint.
retry_attempts = 2
retry_backoff = 45
backoff_multiplier = 2

[files]
account_output = "account.json"
account_txt = "accounts.txt"

[models]
# Free models available on TokenHarbor
free = [
    "deepseek-v4-flash:free",
    "mimo-v2.5:free",
    "qwen3.8-27b:free",
]